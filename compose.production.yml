name: fountlayer-beta

x-app-runtime: &app-runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  stop_grace_period: 20s
  networks:
    - backend

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in the production env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production env file}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in the production env file}
    ports:
      - "127.0.0.1:3332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256m
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  litellm:
    image: ghcr.io/berriai/litellm-non_root:v1.86.2@sha256:511b513bc68956793433d62c1812daff56984325543f6a15431c622823fd90cb
    restart: unless-stopped
    command:
      ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "3305"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in the production env file}
      UPSTREAM_OPENAI_API_KEY: ${UPSTREAM_OPENAI_API_KEY:?Set UPSTREAM_OPENAI_API_KEY in the production env file}
      UPSTREAM_OPENAI_BASE_URL: ${UPSTREAM_OPENAI_BASE_URL:?Set UPSTREAM_OPENAI_BASE_URL in the production env file}
      UPSTREAM_OPENAI_MODEL: ${UPSTREAM_OPENAI_MODEL:?Set UPSTREAM_OPENAI_MODEL in the production env file}
    volumes:
      - ./infra/litellm-config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3305/health/liveliness', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

  migrate:
    <<: *app-runtime
    image: fountlayer/gateway:${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
    build:
      context: .
      target: gateway
      args:
        VERSION: ${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
        VCS_REF: ${FOUNTLAYER_VCS_REF:-unknown}
    restart: "no"
    command: ["node", "node_modules/@fountlayer/db/dist/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5

  seed:
    <<: *app-runtime
    image: fountlayer/gateway:${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
    profiles: ["bootstrap"]
    restart: "no"
    command: ["node", "node_modules/@fountlayer/db/dist/seed.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5

  gateway:
    <<: *app-runtime
    image: fountlayer/gateway:${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
    build:
      context: .
      target: gateway
      args:
        VERSION: ${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
        VCS_REF: ${FOUNTLAYER_VCS_REF:-unknown}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the production env file}
      FOUNTLAYER_ADMIN_TOKEN_SHA256: ${FOUNTLAYER_ADMIN_TOKEN_SHA256:?Set FOUNTLAYER_ADMIN_TOKEN_SHA256 in the production env file}
      FOUNTLAYER_CREDENTIAL_KEY_VERSION: ${FOUNTLAYER_CREDENTIAL_KEY_VERSION:-beta-v1}
      FOUNTLAYER_CREDENTIAL_MASTER_KEY: ${FOUNTLAYER_CREDENTIAL_MASTER_KEY:?Set FOUNTLAYER_CREDENTIAL_MASTER_KEY in the production env file}
      FOUNTLAYER_DEPLOYMENT_ENV: production
      FOUNTLAYER_GATEWAY_ADAPTER: litellm
      FOUNTLAYER_GATEWAY_STORE: postgres
      FOUNTLAYER_SESSION_TICKET_SECRET: ${FOUNTLAYER_SESSION_TICKET_SECRET:?Set FOUNTLAYER_SESSION_TICKET_SECRET in the production env file}
      FOUNTLAYER_SHUTDOWN_GRACE_MS: ${FOUNTLAYER_SHUTDOWN_GRACE_MS:-15000}
      FOUNTLAYER_UPSTREAM_TIMEOUT_MS: ${FOUNTLAYER_UPSTREAM_TIMEOUT_MS:-30000}
      LITELLM_BASE_URL: http://litellm:3305
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in the production env file}
    ports:
      - "127.0.0.1:3300:3300"
    depends_on:
      litellm:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    cpus: 1.0

  console:
    <<: *app-runtime
    image: fountlayer/console:${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
    build:
      context: .
      target: console
      args:
        VERSION: ${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
        VCS_REF: ${FOUNTLAYER_VCS_REF:-unknown}
    environment:
      CONSOLE_GATEWAY_ADMIN_TOKEN: ${CONSOLE_GATEWAY_ADMIN_TOKEN:?Set CONSOLE_GATEWAY_ADMIN_TOKEN in the production env file}
      CONSOLE_GATEWAY_BASE_URL: http://gateway:3300
      CONSOLE_OPERATOR_TOKEN_SHA256: ${CONSOLE_OPERATOR_TOKEN_SHA256:?Set CONSOLE_OPERATOR_TOKEN_SHA256 in the production env file}
      CONSOLE_SESSION_COOKIE_SECURE: ${CONSOLE_SESSION_COOKIE_SECURE:-true}
      CONSOLE_SESSION_SECRET: ${CONSOLE_SESSION_SECRET:?Set CONSOLE_SESSION_SECRET in the production env file}
    ports:
      - "127.0.0.1:3301:3301"
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75

  demo:
    <<: *app-runtime
    image: fountlayer/demo:${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
    build:
      context: .
      target: demo
      args:
        NEXT_PUBLIC_GATEWAY_BASE_URL: ${NEXT_PUBLIC_GATEWAY_BASE_URL:-http://localhost:3300}
        VERSION: ${FOUNTLAYER_IMAGE_TAG:-0.5.0-beta.2}
        VCS_REF: ${FOUNTLAYER_VCS_REF:-unknown}
    environment:
      FOUNTLAYER_SESSION_TICKET_SECRET: ${FOUNTLAYER_SESSION_TICKET_SECRET:?Set FOUNTLAYER_SESSION_TICKET_SECRET in the production env file}
    ports:
      - "127.0.0.1:3302:3302"
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
