name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/v0.5.0-beta

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
        env:
          POSTGRES_DB: fountlayer
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          PGPORT: 3332
        ports:
          - 3332:3332
        options: >-
          --health-cmd "pg_isready -U postgres -d fountlayer -p 3332"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:3332/fountlayer
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:3332/fountlayer_test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release identity
        run: pnpm release:verify

      - name: Audit production dependencies
        run: pnpm audit:prod

      - name: Scan repository for provider keys
        run: pnpm scan:keys

      - name: Verify SDK tarball consumer install
        run: pnpm smoke:sdk-package

      - name: Generate third-party license inventory
        run: pnpm third-party:inventory

      - name: Upload third-party license inventory
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: third-party-license-inventory
          path: artifacts/third-party-licenses.json

      - name: Test
        run: pnpm test

      - name: Migrate database
        run: |
          pnpm db:migrate
          pnpm db:migrate

      - name: Seed database
        run: pnpm db:seed

      - name: Backup and isolated restore drill
        run: |
          pnpm db:backup -- /tmp/fountlayer-backups
          backup="$(find /tmp/fountlayer-backups -type f -name '*.dump' -print | sort | tail -1)"
          pnpm db:restore:verify -- "$backup"

      - name: Test with Postgres
        run: FOUNTLAYER_RUN_DB_TESTS=1 pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      - name: Typecheck and build
        run: pnpm typecheck
