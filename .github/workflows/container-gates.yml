name: Container Gates

on:
  pull_request:
  push:
    branches:
      - main
      - codex/v0.5.0-beta
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [gateway, console, demo]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg VERSION="0.5.0-beta.2" \
            --target "${{ matrix.target }}" \
            --tag "fountlayer/${{ matrix.target }}:ci" \
            .

      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' "fountlayer/${{ matrix.target }}:ci")" = "node"
          docker run --rm --entrypoint sh "fountlayer/${{ matrix.target }}:ci" -c \
            'test ! -e /usr/local/lib/node_modules/npm && ! command -v npm && ! command -v npx'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          artifact-name: fountlayer-${{ matrix.target }}.spdx.json
          format: spdx-json
          image: fountlayer/${{ matrix.target }}:ci
          output-file: fountlayer-${{ matrix.target }}.spdx.json
          upload-release-assets: false

      - name: Scan fixable high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          fail-build: true
          image: fountlayer/${{ matrix.target }}:ci
          only-fixed: true
          output-format: table
          severity-cutoff: high
