name: Runtime Smoke

on:
  push:
    branches:
      - codex/v0.5.0-beta
  workflow_dispatch:

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONSOLE_BASE_URL: http://localhost:3301
      CONSOLE_GATEWAY_ADMIN_TOKEN: change_me_admin_token
      CONSOLE_OPERATOR_TOKEN_SHA256: 5dfdb617a264f003165798fa322395c6f9af41ad6ac4eec7e77b0846d047c243
      CONSOLE_SESSION_SECRET: change_me_console_session_secret_32_bytes_minimum
      CONSOLE_SMOKE_OPERATOR_TOKEN: change_me_console_operator_token
      DATABASE_URL: postgres://postgres:postgres@localhost:3332/fountlayer
      FOUNTLAYER_ADMIN_TOKEN: change_me_admin_token
      FOUNTLAYER_CREDENTIAL_MASTER_KEY: base64:CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      FOUNTLAYER_GATEWAY_STORE: postgres
      FOUNTLAYER_GATEWAY_ADAPTER: litellm
      FOUNTLAYER_SESSION_TICKET_SECRET: change_me_session_ticket_secret_32_bytes_minimum
      FOUNTLAYER_UPSTREAM_TIMEOUT_MS: 10000
      GATEWAY_BASE_URL: http://localhost:3300
      LITELLM_BASE_URL: http://localhost:3305
      LITELLM_MASTER_KEY: change_me
      LOCAL_OPENAI_API_KEY: local-placeholder
      LOCAL_OPENAI_BASE_URL: http://127.0.0.1:3314/v1
      OPENAI_FIXTURE_HOST: 0.0.0.0
      UPSTREAM_OPENAI_API_KEY: local-placeholder
      UPSTREAM_OPENAI_BASE_URL: http://host.docker.internal:3314/v1
      UPSTREAM_OPENAI_MODEL: openai/local-model
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Start OpenAI-compatible network fixture
        run: |
          pnpm fixture:openai > /tmp/fountlayer-openai-fixture.log 2>&1 &
          echo $! > /tmp/fountlayer-openai-fixture.pid
          for attempt in {1..30}; do
            if curl -fsS -H "Authorization: Bearer $LOCAL_OPENAI_API_KEY" "$LOCAL_OPENAI_BASE_URL/models" > /tmp/fountlayer-openai-models.json; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fountlayer-openai-fixture.log
          exit 1

      - name: Start compose dependencies
        run: docker compose -f infra/docker-compose.example.yml up -d postgres litellm

      - name: Wait for Postgres
        run: |
          for attempt in {1..30}; do
            if docker compose -f infra/docker-compose.example.yml exec -T postgres pg_isready -U postgres -d fountlayer -p 3332; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.example.yml logs postgres
          exit 1

      - name: Wait for LiteLLM network path
        run: |
          for attempt in {1..60}; do
            if curl -fsS -H "Authorization: Bearer $LITELLM_MASTER_KEY" "$LITELLM_BASE_URL/v1/models" > /tmp/fountlayer-litellm-models.json; then
              cat /tmp/fountlayer-litellm-models.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.example.yml logs litellm
          exit 1

      - name: Prepare database
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Start Gateway
        run: |
          pnpm --filter @fountlayer/gateway dev > /tmp/fountlayer-gateway.log 2>&1 &
          echo $! > /tmp/fountlayer-gateway.pid

      - name: Wait for Gateway
        run: |
          for attempt in {1..30}; do
            if curl -fsS "$GATEWAY_BASE_URL/health" > /tmp/fountlayer-gateway-health.json; then
              cat /tmp/fountlayer-gateway-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fountlayer-gateway.log
          exit 1

      - name: Start Console
        run: |
          pnpm --filter @fountlayer/console dev > /tmp/fountlayer-console.log 2>&1 &
          echo $! > /tmp/fountlayer-console.pid

      - name: Wait for Console
        run: |
          for attempt in {1..30}; do
            if curl -fsS -H "Authorization: Bearer $CONSOLE_SMOKE_OPERATOR_TOKEN" "$CONSOLE_BASE_URL/overview" > /tmp/fountlayer-console-overview.html; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/fountlayer-console.log
          exit 1

      - name: Runtime smoke
        run: pnpm smoke:runtime

      - name: Dump logs on failure
        if: failure()
        run: |
          test -f /tmp/fountlayer-gateway.log && cat /tmp/fountlayer-gateway.log
          test -f /tmp/fountlayer-console.log && cat /tmp/fountlayer-console.log
          test -f /tmp/fountlayer-openai-fixture.log && cat /tmp/fountlayer-openai-fixture.log
          docker compose -f infra/docker-compose.example.yml logs

      - name: Stop OpenAI-compatible network fixture
        if: always()
        run: |
          test -f /tmp/fountlayer-openai-fixture.pid && kill "$(cat /tmp/fountlayer-openai-fixture.pid)" || true

      - name: Stop compose dependencies
        if: always()
        run: docker compose -f infra/docker-compose.example.yml down -v
