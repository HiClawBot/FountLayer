services:
  postgres:
    image: postgres:16.14-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fountlayer
      PGPORT: 3332
    ports:
      - "3332:3332"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    command: ["redis-server", "--port", "3379"]
    ports:
      - "3379:3379"

  litellm:
    image: ghcr.io/berriai/litellm-non_root:v1.86.2@sha256:511b513bc68956793433d62c1812daff56984325543f6a15431c622823fd90cb
    ports:
      - "3305:3305"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-change_me}
      UPSTREAM_OPENAI_BASE_URL: ${UPSTREAM_OPENAI_BASE_URL:-http://host.docker.internal:3314/v1}
      UPSTREAM_OPENAI_API_KEY: ${UPSTREAM_OPENAI_API_KEY:-local-placeholder}
      UPSTREAM_OPENAI_MODEL: ${UPSTREAM_OPENAI_MODEL:-openai/local-model}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "3305"]

volumes:
  postgres_data:
