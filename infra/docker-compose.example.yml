services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fountlayer
      PGPORT: 3332
    ports:
      - "3332:3332"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    command: ["redis-server", "--port", "3379"]
    ports:
      - "3379:3379"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "3305:3305"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-change_me}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "3305"]

volumes:
  postgres_data:
