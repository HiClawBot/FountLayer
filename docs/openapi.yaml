openapi: 3.1.0
info:
  title: FountLayer Gateway API
  version: 0.5.0-beta.2
  description: OpenAI-compatible Gateway API with attribution, faucet credits, usage events, and billing metadata.
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Gateway is healthy

  /health/dependencies:
    get:
      summary: Dependency readiness check
      responses:
        "200":
          description: Dependencies are healthy
        "503":
          description: One or more dependencies are degraded

  /v1/sessions:
    post:
      summary: Redeem a trusted-backend session ticket
      description: The five-minute, single-use bearer ticket and request headers/body must bind the same managed-mode attribution context.
      security:
        - sessionTicketAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/EndUserId"
        - $ref: "#/components/parameters/UseCase"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributionContext"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionCreated"
        "400":
          description: Invalid request body or header/body attribution mismatch
        "401":
          description: Missing, invalid, or expired session ticket
        "403":
          description: Unsupported mode or ticket/request attribution mismatch
        "409":
          description: Session ticket was already redeemed
        "429":
          description: Session creation rate limit exceeded
        "503":
          description: Durable rate-limit storage is unavailable

  /v1/balance:
    get:
      summary: Return wallet and faucet balances
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/EndUserId"
        - $ref: "#/components/parameters/UseCase"
        - $ref: "#/components/parameters/Mode"
      responses:
        "200":
          description: Balance response

  /v1/faucet-grants:
    get:
      summary: Return active faucet grants for the attribution context
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/EndUserId"
        - $ref: "#/components/parameters/UseCase"
        - $ref: "#/components/parameters/Mode"
      responses:
        "200":
          description: Faucet grants response

  /v1/estimate:
    post:
      summary: Estimate request cost
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/EndUserId"
        - $ref: "#/components/parameters/UseCase"
        - $ref: "#/components/parameters/Mode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Cost estimate

  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completions with FountLayer billing metadata
      description: Uses a pre-call funding estimate, then atomically settles 8-decimal fixed-point amounts from validated adapter token usage and the pinned Store price/policy snapshot.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AppId"
        - $ref: "#/components/parameters/ChannelId"
        - $ref: "#/components/parameters/EndUserId"
        - $ref: "#/components/parameters/UseCase"
        - $ref: "#/components/parameters/Mode"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion
        "402":
          description: Preflight funding failed, or actual usage exceeded balance/route cap; post-provider failures include a failed usage_event_id and charge no user credits
        "409":
          description: Idempotency key is in progress, conflicts with another request, or was completed without a locally replayable response

  /admin/apps:
    get:
      summary: List applications
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Applications with page metadata
    post:
      summary: Create an application
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAppCreate"
      responses:
        "201":
          description: Application created

  /admin/apps/{id}:
    patch:
      summary: Update an application
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAppUpdate"
      responses:
        "200":
          description: Application updated
        "404":
          description: Application not found

  /admin/channels:
    get:
      summary: List channels
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Channels with page metadata
    post:
      summary: Create a channel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChannelCreate"
      responses:
        "201":
          description: Channel created

  /admin/channels/{id}:
    patch:
      summary: Update a channel
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChannelUpdate"
      responses:
        "200":
          description: Channel updated
        "404":
          description: Channel not found

  /admin/faucet-grants:
    get:
      summary: List faucet grants
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
      responses:
        "200":
          description: Faucet grants with page metadata
    post:
      summary: Create a faucet grant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaucetGrantCreate"
      responses:
        "201":
          description: Faucet grant created

  /admin/faucet-grants/{id}:
    patch:
      summary: Update a faucet grant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FaucetGrantUpdate"
      responses:
        "200":
          description: Faucet grant updated
        "404":
          description: Faucet grant not found

  /admin/routes:
    get:
      summary: List route policies
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Route policies with page metadata
    post:
      summary: Create a route policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRouteCreate"
      responses:
        "201":
          description: Route policy created

  /admin/routes/{id}:
    patch:
      summary: Update a route policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRouteUpdate"
      responses:
        "200":
          description: Route policy updated
        "404":
          description: Route policy not found

  /admin/pricing-policies:
    get:
      summary: List pricing policies
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Pricing policies with page metadata
    post:
      summary: Create a pricing policy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingPolicyCreate"
      responses:
        "201":
          description: Pricing policy created

  /admin/pricing-policies/{id}:
    patch:
      summary: Update a pricing policy
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingPolicyUpdate"
      responses:
        "200":
          description: Pricing policy updated
        "404":
          description: Pricing policy not found

  /admin/usage-events:
    get:
      summary: List usage events
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
      responses:
        "200":
          description: Usage events with page metadata

  /admin/ledger:
    get:
      summary: List ledger entries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/CreatedFrom"
        - $ref: "#/components/parameters/CreatedTo"
      responses:
        "200":
          description: Ledger entries with page metadata

  /admin/provider-credentials:
    get:
      summary: List provider credential metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Credential metadata only
    post:
      summary: Create an encrypted provider credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialWrite"
      responses:
        "201":
          description: Credential metadata only

  /admin/provider-credentials/{id}/rotate:
    patch:
      summary: Rotate encrypted provider credential material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialRotate"
      responses:
        "200":
          description: Credential metadata only

  /admin/provider-credentials/{id}:
    delete:
      summary: Delete provider credential material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Credential deleted

  /admin/privacy/request-metadata/purge:
    post:
      summary: Purge expired request metadata without deleting accounting facts
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestMetadataRetentionPurge"
      responses:
        "200":
          description: Request metadata retention purge result

  /admin/sessions/{id}/revoke:
    post:
      summary: Revoke a Gateway session without exposing token material
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session metadata only
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: "#/components/schemas/AdminSession"
        "404":
          description: Session was not found

  /admin/privacy/end-users/anonymize:
    post:
      summary: Anonymize app-owned end-user identifiers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndUserAnonymize"
      responses:
        "200":
          description: End-user anonymization result

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionTicketAuth:
      type: http
      scheme: bearer
      bearerFormat: FountLayer session ticket
      description: Five-minute, single-use ticket minted by the trusted application backend.

  parameters:
    AppId:
      in: header
      name: x-fl-app-id
      required: true
      schema: { type: string }
    ChannelId:
      in: header
      name: x-fl-channel-id
      required: true
      schema: { type: string }
    EndUserId:
      in: header
      name: x-fl-end-user-id
      required: true
      schema: { type: string }
    UseCase:
      in: header
      name: x-fl-use-case
      required: true
      schema: { type: string }
    Mode:
      in: header
      name: x-fl-mode
      required: true
      schema:
        type: string
        enum: [managed, developer_key, byok, local]
    IdempotencyKey:
      in: header
      name: idempotency-key
      required: false
      description: Coordinates a session-scoped billable request. Same-process completed retries replay the response; durable in-progress, conflicting, or completed duplicates return 409 without rebilling.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ResourceId:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1 }
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    Offset:
      in: query
      name: offset
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Search:
      in: query
      name: q
      required: false
      description: Case-insensitive endpoint-specific text search.
      schema: { type: string }
    CreatedFrom:
      in: query
      name: created_from
      required: false
      schema: { type: string, format: date-time }
    CreatedTo:
      in: query
      name: created_to
      required: false
      schema: { type: string, format: date-time }

  schemas:
    Money:
      type: string
      pattern: "^\\d+(\\.\\d{1,8})?$"

    AdminStatus:
      type: string
      enum: [active, disabled]

    FaucetGrantStatus:
      type: string
      enum: [active, exhausted, expired, revoked]

    AdminAppCreate:
      type: object
      additionalProperties: false
      required: [developerId, developerName, id, name]
      properties:
        developerId: { type: string, minLength: 1 }
        developerName: { type: string, minLength: 1 }
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        defaultPricingPolicyId: { type: string, minLength: 1 }
        defaultRouteId: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/AdminStatus"

    AdminAppUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        defaultPricingPolicyId: { type: string, minLength: 1 }
        defaultRouteId: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/AdminStatus"

    AdminChannelCreate:
      type: object
      additionalProperties: false
      required: [appId, id, name, type]
      properties:
        appId: { type: string, minLength: 1 }
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/AdminStatus"

    AdminChannelUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/AdminStatus"

    AdminRouteCreate:
      type: object
      additionalProperties: false
      required: [adapter, alias, appId, id, model, modelAllowlist, provider]
      properties:
        adapter: { type: string, minLength: 1 }
        alias: { type: string, minLength: 1 }
        appId: { type: string, minLength: 1 }
        fallbackModels:
          type: array
          items: { type: string, minLength: 1 }
        id: { type: string, minLength: 1 }
        latencyPreference: { type: string, minLength: 1 }
        maxRetailPrice:
          $ref: "#/components/schemas/Money"
        model: { type: string, minLength: 1 }
        modelAllowlist:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/AdminStatus"

    AdminRouteUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        adapter: { type: string, minLength: 1 }
        alias: { type: string, minLength: 1 }
        appId: { type: string, minLength: 1 }
        fallbackModels:
          type: array
          items: { type: string, minLength: 1 }
        latencyPreference: { type: string, minLength: 1 }
        maxRetailPrice:
          $ref: "#/components/schemas/Money"
        model: { type: string, minLength: 1 }
        modelAllowlist:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        provider: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/AdminStatus"

    FaucetGrantCreate:
      type: object
      additionalProperties: false
      required:
        - allowedModels
        - allowedUseCases
        - appId
        - channelId
        - dailyCap
        - endUserId
        - expiresAt
        - id
        - remaining
      properties:
        allowedModels:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        allowedUseCases:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        amount:
          $ref: "#/components/schemas/Money"
        appId: { type: string, minLength: 1 }
        channelId: { type: string, minLength: 1 }
        dailyCap:
          $ref: "#/components/schemas/Money"
        endUserId: { type: string, minLength: 1 }
        expiresAt: { type: string, format: date-time }
        id: { type: string, minLength: 1 }
        remaining:
          $ref: "#/components/schemas/Money"
        sponsorId: { type: string, minLength: 1 }
        sponsorType: { type: string, minLength: 1 }
        status:
          $ref: "#/components/schemas/FaucetGrantStatus"
        walletId: { type: string, minLength: 1 }

    FaucetGrantUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        allowedModels:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        allowedUseCases:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
        amount:
          $ref: "#/components/schemas/Money"
        dailyCap:
          $ref: "#/components/schemas/Money"
        expiresAt: { type: string, format: date-time }
        remaining:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/FaucetGrantStatus"

    PricingPolicyCreate:
      type: object
      additionalProperties: false
      required: [appId, id, name]
      properties:
        appId: { type: string, minLength: 1 }
        channelMarkupRate:
          $ref: "#/components/schemas/Money"
          description: Must be zero in the external beta.
        developerMarkupRate:
          $ref: "#/components/schemas/Money"
          description: Must be zero in the external beta.
        id: { type: string, minLength: 1 }
        maxTotalMarkupRate:
          $ref: "#/components/schemas/Money"
        name: { type: string, minLength: 1 }
        paymentFeeReserveRate:
          $ref: "#/components/schemas/Money"
        platformFeeRate:
          $ref: "#/components/schemas/Money"
        riskReserveRate:
          $ref: "#/components/schemas/Money"

    PricingPolicyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        appId: { type: string, minLength: 1 }
        channelMarkupRate:
          $ref: "#/components/schemas/Money"
          description: Must be zero in the external beta.
        developerMarkupRate:
          $ref: "#/components/schemas/Money"
          description: Must be zero in the external beta.
        maxTotalMarkupRate:
          $ref: "#/components/schemas/Money"
        name: { type: string, minLength: 1 }
        paymentFeeReserveRate:
          $ref: "#/components/schemas/Money"
        platformFeeRate:
          $ref: "#/components/schemas/Money"
        riskReserveRate:
          $ref: "#/components/schemas/Money"

    AttributionContext:
      type: object
      required: [appId, channelId, endUserId, useCase, mode]
      properties:
        appId: { type: string }
        channelId: { type: string }
        endUserId: { type: string }
        useCase: { type: string }
        mode:
          type: string
          enum: [managed, developer_key, byok, local]

    SessionCreated:
      type: object
      additionalProperties: false
      required: [session_id, token, expires_at]
      properties:
        session_id: { type: string }
        token:
          type: string
          description: Session bearer token; keep it out of URLs, logs, and persistent browser storage.
        expires_at: { type: string, format: date-time }

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content: { type: string }

    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream: { type: boolean }
        metadata:
          type: object
          additionalProperties: true

    ProviderCredentialWrite:
      type: object
      required: [appId, ownerType, ownerId, provider, apiKey]
      properties:
        appId:
          type: string
          description: Active app scope; credential ownership is validated against this app.
        ownerType: { type: string }
        ownerId: { type: string }
        provider: { type: string }
        apiKey:
          type: string
          description: Plaintext provider key accepted only by the authenticated server-side Admin API request body.
        budgetDaily:
          type: string
          pattern: "^\\d+(\\.\\d{1,8})?$"
        budgetMonthly:
          type: string
          pattern: "^\\d+(\\.\\d{1,8})?$"

    ProviderCredentialRotate:
      type: object
      required: [apiKey]
      properties:
        apiKey:
          type: string
          description: Replacement plaintext provider key accepted only by the authenticated server-side Admin API request body.

    AdminSession:
      type: object
      required:
        - id
        - app_id
        - channel_id
        - end_user_id
        - use_case
        - mode
        - expires_at
        - revoked_at
        - created_at
      properties:
        id: { type: string }
        app_id: { type: string }
        channel_id: { type: string }
        end_user_id: { type: string }
        use_case: { type: string }
        mode:
          type: string
          enum: [managed, developer_key, byok, local]
        expires_at: { type: string, format: date-time }
        revoked_at:
          type: [string, "null"]
          format: date-time
        created_at: { type: string, format: date-time }

    RequestMetadataRetentionPurge:
      type: object
      properties:
        retentionDays:
          type: integer
          minimum: 0
          maximum: 3650

    EndUserAnonymize:
      type: object
      required: [appId, endUserId]
      properties:
        appId: { type: string }
        endUserId:
          type: string
          description: App-owned end-user identifier to replace with a tombstone.
